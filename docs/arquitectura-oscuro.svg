<ellipse cx="550" cy="301" rx="70" ry="22" fill="#3a2312" stroke="#f0883e" stroke-width="1.8"/>
</g>
<text x="550" y="363" font-size="18" font-weight="700" text-anchor="middle" style="fill:#f0883e">Amazon S3</text>
<text x="550" y="387" font-size="13" text-anchor="middle" class="suave">huellas</text>
<text x="550" y="405" font-size="13" text-anchor="middle" class="suave">privado · cifrado</text>
<text x="550" y="475" font-size="13" text-anchor="middle" class="suave">se borran solas a los 90 días</text>
