<text x="828" y="104" font-size="24" font-weight="700">Job <tspan class="mono" font-size="22">doctor</tspan></text>
<rect x="1104" y="80" width="168" height="30" rx="15" fill="#0d1117" stroke="#30363d"/>
<text x="1188" y="100" font-size="13" text-anchor="middle" class="suave">solo si algo falla</text>
<rect x="824" y="132" width="452" height="70" rx="12" fill="#10243f" stroke="#4493f8" stroke-width="1.5"/>
<circle cx="862" cy="167.0" r="17" fill="#4493f8"/>
<text x="862" y="173.0" font-size="17" font-weight="700" text-anchor="middle" style="fill:#ffffff">1</text>
<text x="896" y="162" font-size="17" font-weight="700" style="fill:#4493f8">Baja las dos huellas</text>
<text x="896" y="184" font-size="13.5" class="suave">este run y el último verde</text>
<line x1="862" y1="205" x2="862" y2="223" stroke="#6e7681" stroke-width="2" marker-end="url(#flecha-v)"/>
<rect x="824" y="226" width="452" height="70" rx="12" fill="#10243f" stroke="#4493f8" stroke-width="1.5"/>
<circle cx="862" cy="261.0" r="17" fill="#4493f8"/>
<text x="862" y="267.0" font-size="17" font-weight="700" text-anchor="middle" style="fill:#ffffff">2</text>
<text x="896" y="256" font-size="17" font-weight="700" style="fill:#4493f8">Compara</text>
<text x="896" y="278" font-size="13.5" class="suave">runner · herramientas · dependencias · archivos · código</text>
<line x1="862" y1="299" x2="862" y2="317" stroke="#6e7681" stroke-width="2" marker-end="url(#flecha-v)"/>
<rect x="824" y="320" width="452" height="70" rx="12" fill="#10243f" stroke="#4493f8" stroke-width="1.5"/>
<circle cx="862" cy="355.0" r="17" fill="#4493f8"/>
<text x="862" y="361.0" font-size="17" font-weight="700" text-anchor="middle" style="fill:#ffffff">3</text>
<text x="896" y="350" font-size="17" font-weight="700" style="fill:#4493f8">Limpia secretos del log</text>
<text x="896" y="372" font-size="13.5" class="suave">llaves, tokens, claves privadas…</text>
<line x1="862" y1="393" x2="862" y2="411" stroke="#6e7681" stroke-width="2" marker-end="url(#flecha-v)"/>
