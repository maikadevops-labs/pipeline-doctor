<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 690" width="1340" height="690" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Arquitectura de Pipeline Doctor</title>
<desc id="d">El job test guarda la huella del entorno en un bucket privado de S3 mediante OIDC. Si algo falla, el job doctor compara las huellas, limpia secretos del log, opcionalmente pide a Bedrock que redacte, y publica el informe en el resumen del run y en el PR.</desc>
<defs>
  <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#00000066"/>
  </filter>
  <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M1 1 L9 5 L1 9 z" fill="#6e7681"/>
  </marker>
  <marker id="flecha-v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M1 1 L9 5 L1 9 z" fill="#6e7681"/>
  </marker>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .suave { fill: #9198a1; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</defs>
