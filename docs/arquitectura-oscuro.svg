<path d="M80 439 A18 18 0 0 1 116 439" fill="none" stroke="#4493f8" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="98" cy="441" r="2.5" fill="#4493f8"/>
<text x="132" y="425" font-size="17" font-weight="700" fill="#4493f8" style="fill:#4493f8">Guarda la huella</text>
<text x="132" y="449" font-size="14" class="suave">del entorno de cada run</text>
<text x="132" y="471" font-size="13" class="mono suave">if: always()</text>
