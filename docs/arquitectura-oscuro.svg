<text x="84" y="307" font-size="17" font-weight="600">Tus pasos de siempre</text>
<text x="84" y="331" font-size="14" class="suave">instalar · probar · construir</text>
<line x1="190.0" y1="355" x2="190.0" y2="381" stroke="#6e7681" stroke-width="2" marker-end="url(#flecha-v)"/>
<rect x="64" y="387" width="252" height="96" rx="12" fill="#10243f" stroke="#4493f8" stroke-width="1.5"/>
<path d="M92 439 A6 6 0 0 1 104 439" fill="none" stroke="#4493f8" stroke-width="2.2" stroke-linecap="round"/>
