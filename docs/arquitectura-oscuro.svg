<text x="862" y="455.0" font-size="17" font-weight="700" text-anchor="middle" style="fill:#ffffff">4</text>
<text x="896" y="444" font-size="17" font-weight="700" style="fill:#ab7df8">Bedrock redacta</text>
<text x="896" y="466" font-size="13.5" class="suave">opcional · la IA solo explica la evidencia</text>
<line x1="862" y1="487" x2="862" y2="505" stroke="#6e7681" stroke-width="2" marker-end="url(#flecha-v)"/>
<rect x="824" y="508" width="452" height="70" rx="12" fill="#10243f" stroke="#4493f8" stroke-width="1.5"/>
<circle cx="862" cy="543.0" r="17" fill="#4493f8"/>
<text x="862" y="549.0" font-size="17" font-weight="700" text-anchor="middle" style="fill:#ffffff">5</text>
<text x="896" y="538" font-size="17" font-weight="700" style="fill:#4493f8">Publica el informe</text>
<text x="896" y="560" font-size="13.5" class="suave">resumen del run y comentario en el PR</text>
<rect x="828" y="621" width="14" height="14" rx="4" fill="#10243f" stroke="#4493f8" stroke-width="1.5"/>
<text x="850" y="632" font-size="13" class="suave">código determinístico</text>
<rect x="1032" y="621" width="14" height="14" rx="4" fill="#251a3d" stroke="#ab7df8" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="1054" y="632" font-size="13" class="suave">IA, opcional</text>
<text x="40" y="70" font-size="30" font-weight="800">Tu código no cambió.</text>
<text x="40" y="106" font-size="30" font-weight="800" style="fill:#4493f8">Cambió esto.</text>
<text x="40" y="565" font-size="15" class="suave">Compara el entorno del run que falló con el del último run verde.</text>
<text x="40" y="589" font-size="15" class="suave">La comparación es código. La IA solo la explica.</text>
